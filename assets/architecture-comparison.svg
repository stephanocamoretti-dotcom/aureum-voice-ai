  <text x="178" y="285" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">WhatsApp / SIP / WebRTC</text>
  <rect x="324" y="258" width="270" height="44" rx="8" fill="#059669"/>
  <text x="459" y="285" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Gemini Live Native Audio</text>
  <text x="616" y="285" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Sub-second + Native Barge-In</text>
