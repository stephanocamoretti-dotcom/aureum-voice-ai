services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  sip-bridge:
    image: livekit/sip:latest
    depends_on:
      - livekit
      - redis
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: info

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - livekit
      - sip-bridge

  voice-worker:
    build: ./backend
    command: python -m worker.agent start
    env_file:
      - .env
    depends_on:
      - livekit
      - api

  dashboard:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - api
